app {
  name = "epoca-backend"
  environment = "test"
  environment = ${?APP_ENVIRONMENT}
  version = "test"
  version = ${?APP_VERSION}
  apiPrefix = "api"
  apiPrefix = ${?API_PREFIX}
  apiVersion = "v1"
  apiVersion = ${?API_VERSION}
  secretKey = {
    name = "secret-key"
    # No default: when SECRET_KEY is unset, the protected operational routes (health-check/db) are disabled.
    value = ${?SECRET_KEY}
  }
}

appFrontEnd {
  url = "http://google.com"
  url = ${?APP_FE_URL}
  tokenLoginRoute = "/signInByToken?token="
  tokenLoginRoute = ${?APP_FE_TOKEN_LOGIN_ROUTE}
}

client {
  mutation {
    lockTimeout = 5s
    lockTimeout = ${?CLIENT_MUTATION_LOCK_TIMEOUT}
  }
}

pekko {
  loglevel = "DEBUG"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  coordinated-shutdown.exit-jvm = on
  http {
    max-log-bytes = 4096
    server.parsing.max-uri-length = 16k
  }
}

http {
  interface = "0.0.0.0"
  interface = ${?INTERFACE}
  port = 9000
  port = ${?PORT}
  deployedUrl = ""
  deployedUrl = ${?DEPLOYED_URL}
}

saml {
    spX509cert = ""
    spX509cert = ${?SP_X509CERT}
    spKey = ""
    spKey = ${?SP_KEY}
    setTokenUrl = "http://localhost:8000/signin"
    setTokenUrl = ${?SAML_SET_TOKEN_URL}
    failLoginUrl = "http://localhost:8000/signin"
    failLoginUrl = ${?SAML_LOGIN_FAIL_URL}
}

log {
  logLevelRequestResponse = 3
  logLevelRequestResponse = ${?LOG_LEVEL_REQUEST_RESPONSE}
  // 1 error, 2 warning, 3 info, 4 debug
}

db {
  url = ${DB_URL}
  user = ${DB_USER}
  password = ${DB_PASSWORD}
  driver = "org.postgresql.Driver"
  numThreads = 20
  numThreads = ${?DB_NUM_THREADS}
  minConnections = 5
  minConnections = ${?DB_MIN_CONNECTIONS}
  maxConnections = 20
  maxConnections = ${?DB_MAX_CONNECTIONS}
  idleTimeout = 30s
  maxLifetime = 600s

  testConnection {
    timeout = "10s"
    query = "SELECT 1"
  }
}

baklavaRoutes {
    enabled = false
    enabled = ${?BAKLAVA_ROUTES_ENABLED}
    basicAuthUser = "admin"
    basicAuthUser = ${?BAKLAVA_ROUTES_USER}
    basicAuthPassword = "password"
    basicAuthPassword = ${?BAKLAVA_ROUTES_PASSWORD}
}

init-admin {
  email = ${?INIT_ADMIN_EMAIL}
  name = "admin"
  name = ${?INIT_ADMIN_NAME}
  password = "password"
  password = ${?INIT_ADMIN_PASSWORD}
}

login {
  # Required: the API refuses to start when JWT_SECRET is unset, blank or a known placeholder.
  jwtSecret = ${?JWT_SECRET}
  accessTokenValidFor = 5m
  accessTokenValidFor = ${?LOGIN_ACCESS_TOKEN_VALID_FOR}
  refreshTokenValidFor = 30d
  refreshTokenValidFor = ${?LOGIN_REFRESH_TOKEN_VALID_FOR}
  refreshTokenValidForStrategy = "FromFirstUsage"
  refreshTokenValidForStrategy = ${?LOGIN_REFRESH_TOKEN_VALID_FOR_STRATEGY}
}

oauth {
  enabled = false
  enabled = ${?OAUTH_ENABLED}
  issuer = "https://api.company-105f2c1aed.example.invalid/oauth"
  issuer = ${?OAUTH_ISSUER}
  audience = "epoca-api"
  audience = ${?OAUTH_AUDIENCE}
  dummyBcryptHash = "$2a$12$YA0XUgIjP4pUpy9TGjNYY.ILEygX9V/RU5P6ppWCKZaK92YZXRewC"
  dummyBcryptHash = ${?OAUTH_DUMMY_BCRYPT_HASH}

  signing {
    keys = []
    // See docs/operations/oauth-signing-key-ring.md before setting OAUTH_SIGNING_KEY_RING_B64.
    keyRingB64 = ${?OAUTH_SIGNING_KEY_RING_B64}
  }

  ipRateLimit {
    capacity = 60
    refillPeriod = 60s
  }

  knownClientFailedSecretRateLimit {
    capacity = 10
    refillPeriod = 300s
  }

  authenticationAuditRetention = 90d
  auditCleanupBatchSize = 500
  rateLimitCleanupBatchSize = 500
  trustedProxyCidrs = []

  retentionSchedulableJob {
    enabled = "true"
    initialDelay = "45s"
    tickTime = "1h"
  }
}

user {
  # No default: when unset or shorter than 32 characters, creating a super admin through POST /users is disabled.
  createAdminSecretKey = ${?USER_CREATE_ADMIN_SECRET_KEY}
  password {
    minimumLength = 8
    maximumLength = 64
    includeDigit = true
    includeLetter = true
    includeLowerLetter = true
    includeUpperLetter = true
    includeSpecialChar = true
  }
  totp {
    qrFormat = "otpauth://totp/sample:{id}?secret={secret}&issuer=sample"
    secretLength = 30
    algorithm = "HmacSHA1"
    timeStepInSeconds = 30
    passwordLength = 6
  }
  loginToken {
    recoveryCount = 5
    recoveryCount = ${?USER_LOGIN_TOKEN_RECOVERY_COUNT}
    stableSalt = "$2a$12$Ml0CFnKk4/39yCG1M5FzQO"
    stableSalt = ${?USER_LOGIN_TOKEN_STABLE_SALT}
    validForDuration = 1day
    validForDuration = ${?USER_LOGIN_TOKEN_VALID_FOR}
    purgeExpiredSchedulableJob {
      enabled = "true"
      initialDelay = "15s"
      tickTime = "5m"
    }
  }
}

workUnit.businessZone = "Europe/Warsaw"
workUnit.businessZone = ${?WORK_UNIT_BUSINESS_ZONE}

workUnit.idempotency {
  responseRetention = 24h
  redactSchedulableJob {
    enabled = "true"
    initialDelay = "30s"
    tickTime = "15m"
  }
}

stats.pivot.maxDisplayValueCellCount = 9600
stats.pivot.maxDisplayValueCellCount = ${?PIVOT_MAX_DISPLAY_VALUE_CELL_COUNT}

export.pivot {
  tempDirectory = "/tmp/epoca-pivot-export"
  tempDirectory = ${?PIVOT_EXPORT_TEMP_DIRECTORY}
  requestMaxBytes = 67108864
  unmaterializedArtifactTimeout = 30s
  unmaterializedArtifactTimeout = ${?PIVOT_EXPORT_UNMATERIALIZED_ARTIFACT_TIMEOUT}
  streamIdleTimeout = 2m
  streamIdleTimeout = ${?PIVOT_EXPORT_STREAM_IDLE_TIMEOUT}
  maxConcurrentRequests = 2
  maxConcurrentRequests = ${?PIVOT_EXPORT_MAX_CONCURRENT_REQUESTS}
}

mail {
  # SendGrid dynamic template names; PL falls back to EN. Required fields:
  # organizationName, invitationLink, expiresAt (ISO instant), locale (pl/en).
  # invitationLink uses appFrontEnd.url + /invitations/accept#token=<base64url>.
  invitation.templates {
    pl = "userorganizationinvitationpl"
    pl = ${?SENDGRID_INVITATION_TEMPLATE_PL}
    en = "userorganizationinvitation"
    en = ${?SENDGRID_INVITATION_TEMPLATE_EN}
  }
  fromEmail = "user-21f513753a4e@example.test"
  fromEmail = ${?SENDGRID_SENDER}
  fromName = "Iterators"
  subjectPrefix = ""
  subjectPrefix = ${?MAILER_SUBJECT_PREFIX}
  blacklistedDomains = []
  blacklistedDomains = ${?MAILER_BLACKLISTED_DOMAINS}

  sendgrid {
    webhook {
      publicKey = ""
      publicKey = ${?SENDGRID_WEBHOOK_PUBLIC_KEY}
      maxAge = 5m
      maxFutureSkew = 30s
      maxBodyBytes = 1048576
    }
    apiKey = "INCORRECT_API_KEY"
    apiKey = ${?SENDGRID_API_KEY}
    sendUrl = "https://api.sendgrid.com/v3/mail/send"
    templatesUrl = "https://api.sendgrid.com/v3/templates?generations=dynamic"
  }

  sync {
    enabled = "false"
    enabled = ${?SENDGRID_SYNC_ENABLED}
    initialDelay = "10s"
    tickTime = "5m"
  }

}

metrics {
    frontEndErrors {
        truncateLength = 10000
        truncateLength = ${?METRICS_FRONTEND_ERRORS_TRUNCATE_LENGTH}
    }
}

organization {
    external-origin = "http://localhost"
    external-origin = ${?ORGANIZATION_EXTERNAL_ORIGIN}
}

kamon {
  enabled = true
  enabled = ${?KAMON_ENABLED}

  environment {
    service = "api"
  }

  modules {
    datadog-agent {
      enabled = true
      enabled = ${?KAMON_DATADOG_AGENT_ENABLED}
    }

    datadog-trace-agent {
      enabled = true
      enabled = ${?KAMON_DATADOG_TRACE_AGENT_ENABLED}
    }

    datadog-api {
      enabled = false
      enabled = ${?KAMON_DATADOG_API_ENABLED}
    }
  }

  datadog {
    time-units = "ms"
    information-unit = "b"

    agent {
      hostname=${?KAMON_DATADOG_AGENT_HOST}
      port = 8125
    }

    trace {
      api-url = "http://"${?KAMON_DATADOG_AGENT_HOST}":8126/v0.4/traces"
    }

    additional-tags {
      service = "yes"
      host = "yes"
      instance = "yes"
    }
  }

  metric {
    tick-interval = 2 seconds
  }

  util.filters {
    "pekko.tracked-actor" {
      includes = [ ]
      excludes = [ "*/system/**", "*/user/IO-**" ]
    }

    "pekko.tracked-router" {
      includes = [ ]
      excludes = [ ]
    }

    "pekko.tracked-dispatcher" {
      includes = [ "**" ]
      excludes = [ ]
    }

    "pekko.traced-actor" {
      includes = [ ]
      excludes = [ ]
    }
  }
}

assets {
  # "memory" (local dev/tests, nothing is persisted) or "s3" (any S3 compatible service)
  storage = "memory"
  storage = ${?ASSETS_STORAGE}
  memory {
    publicBaseUrl = "http://localhost/assets"
    publicBaseUrl = ${?ASSETS_MEMORY_PUBLIC_BASE_URL}
  }
  s3 {
    bucket = ""
    bucket = ${?ASSETS_AWS_S3_BUCKET}
    region = ${s3.region}
    # Endpoint override for non-AWS S3 compatible services; leave unset for AWS S3
    endpoint = ${?ASSETS_AWS_S3_ENDPOINT}
    pathStyle = false
    pathStyle = ${?ASSETS_AWS_S3_PATH_STYLE}
    cdnDomain = ${?ASSETS_AWS_CDN_DOMAIN}
    # Optional static credentials; the default AWS credentials provider chain is used when unset
    accessKeyId = ${?ASSETS_AWS_ACCESS_KEY_ID}
    secretAccessKey = ${?ASSETS_AWS_SECRET_ACCESS_KEY}
    presignedUrlValidFor = "10m"
  }
}

user.avatarSync {
  # Requires assets.storage = "s3"; startup fails when enabled together with the non-persistent memory storage
  enabled = false
  enabled = ${?USER_AVATAR_SYNC_ENABLED}
  maxBytes = 2097152
  timeout = "5s"
  allowedHosts = ["googleusercontent.com"]
}

s3 {
    region = "eu-north-1"
    region = ${?AWS_S3_REGION}
}

smses {
  userTokenSms = "Your login token is {token}"
}

firebase {
  key = ${?FIREBASE_KEY}
}

# Invitation onboarding is opt-in after complete feature verification.
invitation {
  retentionCleanupBatchSize = 500
  retentionSchedulableJob {
    enabled = true
    initialDelay = 45s
    tickTime = 1m
    tickTimeAfterNoWork = 1h
  }
  featureEnabled = false
  featureEnabled = ${?INVITATION_FEATURE_ENABLED}
  # A HOCON list may override this for multiple exact frontend origins.
  allowedOrigins = [${?INVITATION_FRONTEND_ORIGIN}]
  rateKey = ${?INVITATION_RATE_KEY}
  localHttp = false
  crossSite = false
}
pekko.http.server.remote-address-attribute = on

# Requires user.avatarSync.enabled and persistent asset storage. No credentials or network access until a matching successful SAML login.
saml.workspacePhotos {
  enabled = false
  enabled = ${?SAML_WORKSPACE_PHOTOS_ENABLED}
  # JSON/HOCON list, optionally supplied as an environment string. Match immutable organization UUID + exact SAML issuer + exact email domains.
  # [{ organizationId="<uuid>", issuer="<SAML entity ID>", domains=["example.com"], credentialsFile="/run/secrets/google-workspace.json", delegatedAdmin="admin@example.com" }]
  tenants = []
  tenants = ${?SAML_WORKSPACE_PHOTOS_TENANTS}
}
