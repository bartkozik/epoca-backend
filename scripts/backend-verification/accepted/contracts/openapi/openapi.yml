        without Idempotency-Key return the legacy Created response and call create once
        document Idempotency-Key as optional
        with a canonical UUID call the idempotency facade and return its first exact response
        replay a stored custom status 299 and exact body with one replay header
        fail with InternalServerError for an invalid persisted status 600 without a silent fallback
        reject an invalid Idempotency-Key before invoking either service
        reject a noncanonical UUID accepted leniently by UUID.fromString
        return Conflict (409) for an idempotency key conflict with the exact problem response
        return Conflict (409) for an unsupported idempotency version with the exact problem response
        return 410 Gone for an expired idempotency result with the exact problem response
