  /organizations/{organizationSlug}/users/assign:
    post:
      summary: Assign user to organization
      description: |-
        POST /organizations/{organizationSlug}/users/assign should
        be inaccessible for no-logged user
        be BadRequest on empty json
        return NotFound when service returns OperationNotPermitted
        return NotFound when service returns OrganizationNotFound
        return NotFound when service returns UserIsNotOrganizationMember
        return BadRequest when service returns InvalidRequest
        return Conflict when service returns UserAlreadyAssigned
        return OK otherwise
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pl.iterators.epoca.organization.services.OrganizationUserAssignService.OrganizationUserAssignRequest'
            examples:
              minimal:
                value: |-
                  {
                    "userId" : "5ff3c2c4-1f4c-4420-a85d-389f2ef7a040",
                    "roles" : [
                    ]
                  }
              maximal:
                value: |-
                  {
                    "userId" : "62a696df-d3f1-4fc9-97aa-5c9fd1fb0004",
                    "roles" : [
                      "Manager",
                      "External"
                    ]
                  }
        required: true
      responses:
        "200":
          description: return OK otherwise
          content:
            application/json: {}
        "400":
          description: |-
            be BadRequest on empty json
            return BadRequest when service returns InvalidRequest
        "401":
          description: be inaccessible for no-logged user
        "404":
          description: |-
            return NotFound when service returns OperationNotPermitted
            return NotFound when service returns OrganizationNotFound
            return NotFound when service returns UserIsNotOrganizationMember
        "409":
          description: return Conflict when service returns UserAlreadyAssigned
      security:
      - bearerAuth: []
    parameters:
    - name: organizationSlug
      in: path
      required: true
      schema:
        type: string
