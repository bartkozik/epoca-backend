        be inaccessible for no-logged user
        be BadRequest on empty json
        return NotFound when service returns OperationNotPermitted
        return NotFound when service returns OrganizationNotFound
        return BadRequest when service returns UserAlreadyUnassigned
        return BadRequest when service returns InvalidRequest
        return NoContent otherwise
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pl.iterators.epoca.organization.services.OrganizationUserDeassignService.OrganizationDeassignRequest'
