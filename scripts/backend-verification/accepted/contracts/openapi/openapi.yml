  /organizations/{organizationSlug}/work-units:
    get:
      summary: |-
        List work units. Requesting users' work units require admin/owner/manager access.
        Parameters id, dateFrom, dateTo, projectId - list, userId - list, clientId - list, state - list, includeArchived - bool, shouldReturnDraftIds - bool, includePmClassification - bool, pmProjectId - list, pmClientId - list (PM filters require includePmClassification=true), pageSize - pagination, pageNumber - pagination
      description: |-
        GET /organizations/{organizationSlug}/work-units should
        be inaccessible for no-logged user
        return NotFound if service returns NoAccessToOrganization
        return NotFound if service returns OrganizationNotFound
        return Forbidden if service returns PmClassificationForbidden
        return Ok with service data otherwise
        return Ok with service data when all optional params provided
        decode includePmClassification and preserve repeatable PM project/client filters independently from source filters
        return 400 for PM filters without includePmClassification=true using the stable validation problem
        keep the ordinary report shape when PM inclusion is requested but the service returns no visible PM section
        preserve every repeated filter from a URI above the former limit
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          example: 55555555-5555-4555-8555-555555555555
      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
          example: 2026-08-01
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
          example: 2026-08-06
      - name: projectId
        in: query
        required: false
        schema:
          type: string
          example: 66666666-6666-4666-8666-666666666666
      - name: userId
        in: query
        required: false
        schema:
          type: string
          example: 77777777-7777-4777-8777-777777777777
      - name: clientId
        in: query
        required: false
        schema:
          type: string
          example: 88888888-8888-4888-8888-888888888888
      - name: state
        in: query
        required: false
        schema:
          type: string
          example: Draft
      - name: includeArchived
        in: query
        required: false
        schema:
          type: string
          example: "false"
      - name: shouldReturnDraftIds
        in: query
        required: false
        schema:
          type: string
          example: "false"
      - name: includePmClassification
        in: query
        required: false
        schema:
          type: string
          example: "true"
      - name: pmProjectId
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          example:
          - 11111111-1111-4111-8111-111111111111
          - 11111111-1111-4111-8111-111111111112
        style: form
        explode: true
      - name: pmClientId
