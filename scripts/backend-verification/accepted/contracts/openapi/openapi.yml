        Worklog and userId defaults to the authenticated user.
      description: |-
        POST /organizations/{organizationSlug}/work-units should
        be inaccessible for no-logged user
        decode legacy missing and explicit null entryType/userId as defaultable fields
        decode future Note with missing or null duration and return PT0S plus entryType
        reject unknown and mis-cased entryType with the existing static validation problem
        return NotFound if service returns OrganizationNotFound
        return BadRequest if service returns NonPositiveDuration
        return BadRequest if service returns NonNeutralNoteDuration
        return BadRequest if service returns FutureWorklogDate
        return Forbidden if service returns NoAccessToTargetUser
        return Forbidden if service returns TargetUserNotAssignedToProject
        return NotFound if service returns TargetUserNotFound
        return NotFound if service returns NoAccessToOrganization
        return NotFound if service returns ProjectNotFound
        return Forbidden if service returns NoAccessToProject
