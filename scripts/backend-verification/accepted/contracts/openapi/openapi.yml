openapi: 3.0.1
info:
  title: Autogenerated API doc
  version: "1"
paths:
  /auth/admin:
    post:
      summary: Generate jwt for specified user by admin
      description: |-
        POST /auth/admin should
        be inaccessible for no logged users
        return Unauthorized when caller is not an admin
        return NotFound when user does not exist
        return generated jwt
      parameters:
      - name: device-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pl.iterators.epoca.auth.services.AdminImpersonateLoginService.AdminImpersonateLoginRequest'
            examples:
              minimal:
                value: |-
                  {
                    "userId" : "898cf993-20a0-47e9-8304-379e8d55165e",
                    "validFor" : "PT1S"
                  }
              maximal:
                value: |-
                  {
                    "userId" : "5a306286-e282-4198-9c86-68f6c0c45cc8",
                    "validFor" : "PT212H40M48S"
                  }
        required: true
      responses:
        "401":
          description: |-
            be inaccessible for no logged users
            return Unauthorized when caller is not an admin
        "404":
          description: return NotFound when user does not exist
  /auth/crypto:
