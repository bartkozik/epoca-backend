        style: form
        explode: true
      - name: pageSize
        in: query
        required: false
        schema:
          type: string
          example: "25"
      - name: pageNumber
        in: query
        required: false
        schema:
          type: string
          example: "1"
      responses:
        "200":
          description: |-
            return Ok with service data otherwise
            return Ok with service data when all optional params provided
